# The (1, 3) helix at r/R = 0.2 (docs/KNOTTED_GUIDE.md sections 3.2 and 9 item 5): T915-S's section on the unknotted
# torus curve that winds three times round a torus once round, at T915-S's length, framed k = 0: the control for
# leaving the plane without a knot (E2-22). Read by array16.twin.Design.
#
# Its tightest bend is 25.0 mm; framed k = 0 its tightest radius in the boards' plane is 29.1 mm, 1.57 times
# T915-S's (and 1.64 times T915-S's tightest bend).
name = "helix (1, 3)"
about = "T915-S's facing flex strips on the (1, 3) torus curve at r/R = 0.2, framed k = 0"
