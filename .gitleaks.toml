# The default rules, with one exception. The openEMS evaluation cache names each record by the first 16 hex
# digits of a SHA-1 of its design parameters (experiments/vivaldi_openems.py::eval_key), under the field "key",
# which the generic API-key rule takes for a secret.
[extend]
useDefault = true

[[allowlists]]
description = "record keys of the openEMS evaluation cache: SHA-1 prefixes of design parameters"
targetRules = ["generic-api-key"]
paths = ['''^experiments/vivaldi/evals\.jsonl$''']
