[project]
name = "array16"
version = "0.1.0"
description = "Host library, controller protocol and simulator for a 4x4 phased-array SDR board at 5.8 GHz"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "matplotlib", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["array16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Lint and type checks cover only the files written to that standard (from 2026-11-17 on). Older files are not
# covered yet: add each one to both lists when it is brought up to it. 120 columns is the width the older files
# were written to (almost none of their lines pass it; one in eight passes 100).
[tool.ruff]
line-length = 120
target-version = "py310"
include = [
    "array16/particles.py",
    "tests/test_particles.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "PT", "RUF"]

[tool.mypy]
strict = true
follow_imports = "silent"
files = [
    "array16/particles.py",
    "tests/test_particles.py",
]
