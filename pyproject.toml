[project]
name = "array16"
version = "0.1.0"
description = "Host library, controller protocol and simulator for a 4x4 phased-array SDR board at 5.8 GHz"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "matplotlib", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["array16", "array16.particles", "array16.guide", "array16.twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "experiments"]

# Lint and type checks cover only the files written to that standard (from 2026-11-17 on). Older files are not
# covered yet: add each one to both lists when it is brought up to it. 120 columns is the width the older files
# were written to (almost none of their lines pass it; one in eight passes 100).
[tool.ruff]
line-length = 120
target-version = "py311"
include = [
    "array16/particles/*.py",
    "array16/lab.py",
    "tests/test_lab.py",
    "tests/test_particles.py",
    "tests/test_laws.py",
    "tests/conftest.py",
    "experiments/guide_study.py",
    "experiments/guide_posthoc.py",
    "experiments/accelerator_study.py",
    "tests/test_accelerator_study.py",
    "tests/test_guide_record.py",
    "experiments/virtual_antenna_study.py",
    "tests/test_virtual_antenna_study.py",
    "experiments/cavity_knots_study.py",
    "tests/test_cavity_knots_study.py",
    "experiments/beam_lifecycle_study.py",
    "tests/test_beam_lifecycle_study.py",
    "experiments/knotted_guide_study.py",
    "tests/test_knotted_guide_study.py",
    "array16/guide/*.py",
    "array16/twin/*.py",
    "tests/test_guide_sections.py",
    "tests/test_guide_ring.py",
    "tests/test_guide_multipactor.py",
    "tests/test_particle_sections.py",
    "tests/test_twin.py",
    "tests/test_twin_dr0.py",
    "experiments/twin_rung1.py",
    "tests/test_twin_rung1.py",
    "experiments/twin_rung1_figures.py",
    "tests/test_twin_rung1_figures.py",
    "experiments/twin_openems_line.py",
    "tests/test_twin_openems_line.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "PT", "RUF"]
# The symbols of the physics, wanted as they are in the reports the scripts write.
allowed-confusables = ["ρ", "α", "×", "−"]

[tool.mypy]
strict = true
follow_imports = "silent"
files = [
    "array16/particles",
    "array16/lab.py",
    "tests/test_lab.py",
    "tests/test_particles.py",
    "tests/test_laws.py",
    "tests/conftest.py",
    "experiments/guide_study.py",
    "experiments/guide_posthoc.py",
    "experiments/accelerator_study.py",
    "tests/test_accelerator_study.py",
    "tests/test_guide_record.py",
    "experiments/virtual_antenna_study.py",
    "tests/test_virtual_antenna_study.py",
    "experiments/cavity_knots_study.py",
    "tests/test_cavity_knots_study.py",
    "experiments/beam_lifecycle_study.py",
    "tests/test_beam_lifecycle_study.py",
    "experiments/knotted_guide_study.py",
    "tests/test_knotted_guide_study.py",
    "array16/guide",
    "array16/twin",
    "tests/test_guide_sections.py",
    "tests/test_guide_ring.py",
    "tests/test_guide_multipactor.py",
    "tests/test_particle_sections.py",
    "tests/test_twin.py",
    "tests/test_twin_dr0.py",
    "experiments/twin_rung1.py",
    "tests/test_twin_rung1.py",
    "experiments/twin_rung1_figures.py",
    "tests/test_twin_rung1_figures.py",
    "experiments/twin_openems_line.py",
    "tests/test_twin_openems_line.py",
]
